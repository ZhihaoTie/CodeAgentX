codeagentx:
  runtime:
    base-url: http://127.0.0.1:8765
    poll-delay-ms: 500
    run-timeout-ms: ${CODEAGENTX_RUNTIME_RUN_TIMEOUT_MS:60000}
  workspace:
    root: ../.codeagentx/control-plane/smoke-workspaces
  publisher:
    mode: noop
  github:
    webhook-secret: ""

    default-verification-command: py -3.13 -B -m unittest discover -s tests -v
spring:
  datasource:
    url: jdbc:h2:mem:codeagentx_smoke;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
